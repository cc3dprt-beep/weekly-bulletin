// ─── YARDIMCI FONKSİYONLAR ──────────────────────────────────────────────────
function formatFullDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return `${d} ${AYLAR[m-1]} ${y}`;
}
function formatCardDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const jsDate = new Date(Date.UTC(y, m-1, d));
    return `${GUNLER[jsDate.getUTCDay()]}, ${d} ${AYLAR[m-1]} ${y}`;
}

// ─── HAFTA SEÇİCİ ───────────────────────────────────────────────────────────
function populateWeekSelector() {
    const selector = document.getElementById('week-selector');
    const mondays = EPHEMERIS.filter(d => {
        const [y,m,day] = d.date.split('-').map(Number);
        return new Date(Date.UTC(y,m-1,day)).getUTCDay() === 1;
    });
    mondays.forEach((mon, idx) => {
        const [y,m,d] = mon.date.split('-').map(Number);
        const end = new Date(Date.UTC(y,m-1,d));
        end.setUTCDate(end.getUTCDate() + 6);
        const endStr = `${end.getUTCDate()} ${AYLAR[end.getUTCMonth()]} ${end.getUTCFullYear()}`;
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${d} ${AYLAR[m-1]} ${y} - ${endStr}`;
        selector.appendChild(opt);
    });
    return mondays;
}

function getWeekData(mondayDate) {
    const startIdx = EPHEMERIS.findIndex(d => d.date === mondayDate);
    if (startIdx === -1) return null;
    return EPHEMERIS.slice(startIdx, startIdx + 7);
}

    const interactions = [];
    checkMoonJupiter(weekData, interactions);
    checkSadeSati(weekData, interactions);
    checkMoonSaturnConj(weekData, interactions);
    checkEclipses(weekData, interactions);
    checkSignChanges(weekData, interactions);
    checkMoonMarsConj(weekData, interactions);

    interactions.sort((a,b) => a.date.localeCompare(b.date));

    if (!interactions.length) {
        return '<h2>Haftanın Önemli Etkileşimleri</h2><p>Bu hafta öne çıkan majör bir astrolojik etkileşim bulunmamaktadır. Enerjiler daha çok günlük bazda şekillenecektir.</p>';
    }

    // Aynı mesajları grupla
    const grouped = {};
    interactions.forEach(it => {
        const key = it.type + '_' + it.message;
        if (!grouped[key]) grouped[key] = {...it, dates:[it.date]};
        else grouped[key].dates.push(it.date);
    });

    let html = '<h2>Haftanın Önemli Etkileşimleri</h2>';
    Object.values(grouped).forEach(it => {
        html += `<div class="notice-box ${it.class}"><strong>${groupDates(it.dates)}:</strong> ${it.message}</div>`;
    });
    return html;
}

function groupDates(dates) {
    if (dates.length === 1) return formatFullDate(dates[0]);
    let groups = [], temp = [dates[0]];
    for (let i = 1; i < dates.length; i++) {
        const prev = new Date(temp[temp.length-1]+'T00:00:00Z');
        const curr = new Date(dates[i]+'T00:00:00Z');
        if ((curr - prev) === 86400000) temp.push(dates[i]);
        else { groups.push(temp); temp = [dates[i]]; }
    }
    groups.push(temp);
    return groups.map(g => g.length > 1
        ? `${g[0].split('-')[2]} - ${formatFullDate(g[g.length-1])}`
        : formatFullDate(g[0])
    ).join(', ');
}

function checkMoonJupiter(weekData, out) {
    weekData.forEach(d => {
        const mo = d.planets.Mo.sign, ju = d.planets.Ju.sign;
        if (mo === ju || mo === (ju+6)%12) out.push({date:d.date,type:'moonJu',class:'notice-success',
            message:'Ay, Jüpiter ile olumlu bir etkileşimde. Bilgelik, şans ve maneviyatla ilgili konular için harika bir zaman dilimidir. Finansal konularda ve eğitimde destekleyici enerjiler hakimdir.'});
    });
}
function checkSadeSati(weekData, out) {
    weekData.forEach(d => {
        const mo = d.planets.Mo.sign, sa = d.planets.Sa.sign;
        const prev = (sa-1+12)%12, next = (sa+1)%12;
        if (mo===sa||mo===prev||mo===next) out.push({date:d.date,type:'sadeSati',class:'notice-danger',
            message:"Ay, Satürn'ün etkisinde (Sade Sati). Zihinsel baskı, gecikmeler ve engellerle karşılaşılabilir. Sabırlı olmak, sorumlulukları aksatmamak ve büyük kararlardan kaçınmak önemlidir."});
    });
}
function checkMoonSaturnConj(weekData, out) {
    weekData.forEach(d => {
        if (d.planets.Mo.sign === d.planets.Sa.sign) out.push({date:d.date,type:'moSaConj',class:'notice-danger',
            message:'<strong>Özel Uyarı:</strong> Ay ve Satürn kavuşumu aktif. Duygusal olarak karamsar ve kısıtlanmış hissedilebilir. Yeni bir şeye başlamak için kesinlikle uygun değildir.'});
    });
}
function checkEclipses(weekData, out) {
    weekData.forEach(d => {
        const {Mo,Su,Ra,Ke} = d.planets;
        if (Mo.sign===Ra.sign) out.push({date:d.date,type:'moRa',class:'notice-warning',message:'Ay, Rahu ile kavuşuyor. Korku, endişe, zihinsel karmaşa ve kararsızlık riski artabilir. Önemli kararlar için beklenmesi tavsiye edilir.'});
        if (Mo.sign===Ke.sign) out.push({date:d.date,type:'moKe',class:'notice-warning',message:'Ay, Ketu ile kavuşuyor. Geçmişe takılı kalma, melankoli ve içe kapanma eğilimi görülebilir. Meditasyon ve ruhsal çalışmalar için uygundur.'});
        if (Su.sign===Ra.sign) out.push({date:d.date,type:'suRa',class:'notice-warning',message:'Güneş, Rahu ile kavuşuyor. Otorite figürleri, devlet veya baba ile ilgili konularda beklenmedik sorunlar yaşanabilir. Ego çatışmalarına dikkat edilmelidir.'});
        if (Su.sign===Ke.sign) out.push({date:d.date,type:'suKe',class:'notice-warning',message:'Güneş, Ketu ile kavuşuyor. Özgüven eksikliği ve belirsizlik hissi artabilir. Otoriteyle ilişkilerde geri planda kalma eğilimi görülebilir.'});
    });
}
function checkSignChanges(weekData, out) {
    const major = ['Su','Ju','Sa','Ra','Ke','Ve','Ma'];
    for (let i = 0; i < weekData.length-1; i++) {
        major.forEach(k => {
            if (weekData[i].planets[k].sign !== weekData[i+1].planets[k].sign) {
                const newSign = ZODIAC_SIGNS[weekData[i+1].planets[k].sign];
                const c = BURC_YORUMLARI[newSign];
                out.push({date:weekData[i+1].date,type:'signChange',class:'notice-info',
                    message:`${PLANET_NAMES[k]}, ${newSign} burcuna geçiş yapıyor. Bu geçiş ${c.house}. evin temsil ettiği ${c.themes} konularını önümüzdeki dönemde öne çıkaracak.`});
            }
        });
    }
}
function checkMoonMarsConj(weekData, out) {
    weekData.forEach(d => {
        if (d.planets.Mo.sign === d.planets.Ma.sign) out.push({date:d.date,type:'moMa',class:'notice-danger',
            message:'Ay ve Mars kavuşumu devrede. Huzursuzluk, gerginlik, acelecilik ve çatışma potansiyeli artabilir. Ani tepkilerden ve riskli hareketlerden kaçınmakta fayda var.'});
    });
}

// ─── GÜNLÜK GÜNCE ───────────────────────────────────────────────────────────
function generateDailyLog(weekData) {
    let html = '<h2>Haftanın Güncesi</h2>';
    weekData.forEach(dayData => {
        html += `<h3>${formatCardDate(dayData.date)}</h3>`;
        const morningNak = dayData.morning.Mo.nakshatra;
        const eveningNak = dayData.evening.Mo.nakshatra;
        const isMoMa = dayData.planets.Mo.sign === dayData.planets.Ma.sign;

        if (morningNak === eveningNak) {
            html += formatNakshatraComment(morningNak, isMoMa);
        } else {
            html += '<strong>Öğleden Önce:</strong>' + formatNakshatraComment(morningNak, isMoMa);
            html += '<br><strong>Öğleden Sonra:</strong>' + formatNakshatraComment(eveningNak, isMoMa);
        }
    });
    return html;
}

function formatNakshatraComment(name, isMoMa) {
    const y = NAKSHATRA_YORUMLARI[name];
    if (!y) return '<p>Yorum bulunamadı.</p>';
    const riskyWords = ['evlilik','iş kurma','ortaklık'];
    let note = '';
    if (isMoMa) {
        const text = (y.destek + y.dikkat).toLowerCase();
        if (riskyWords.some(w => text.includes(w)))
            note = '<p><strong class="caution-action">(Ay-Mars Notu: Bu eylemler desteklense de, Ay-Mars kavuşumunun getirebileceği gerginlik nedeniyle ekstra dikkat ve sabır gerektirebilir.)</strong></p>';
    }
    return `<div style="margin-top:0.5rem;">
        <p class="supported-action">${y.destek}</p>
        <p class="caution-action">${y.dikkat}</p>
        ${note}
    </div>`;
}

// ─── PDF ─────────────────────────────────────────────────────────────────────
function downloadPDF() {
    const content = document.getElementById('bulletin-content');
    const btn = document.getElementById('pdf-btn');
    btn.textContent = 'Oluşturuluyor...';
    btn.disabled = true;

    html2canvas(content, {scale:2, useCORS:true}).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const {jsPDF} = window.jspdf;
        const pdf = new jsPDF({orientation:'p', unit:'mm', format:'a4'});
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const iw = pw - 20;
        const ih = iw / (canvas.width / canvas.height);
        let left = ih, pos = 10;
        pdf.addImage(imgData,'PNG',10,pos,iw,ih);
        left -= (ph - 20);
        while (left > 0) {
            pos = left - ih + 10;
            pdf.addPage();
            pdf.addImage(imgData,'PNG',10,pos,iw,ih);
            left -= (ph - 20);
        }
        pdf.save('haftalik-astroloji-bulteni.pdf');
    }).catch(err => {
        console.error(err);
        alert('PDF oluşturulurken hata oluştu.');
    }).finally(() => {
        btn.textContent = 'PDF Olarak İndir';
        btn.disabled = false;
    });
}

// ─── BAŞLANGIÇ ───────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    const mondays = populateWeekSelector();
    const selector = document.getElementById('week-selector');

    function loadWeek(idx) {
        const weekData = getWeekData(mondays[idx].date);
        if (weekData && weekData.length === 7) generateBulletin(weekData);
    }

    selector.addEventListener('change', e => loadWeek(parseInt(e.target.value)));

    // Mevcut haftayı otomatik seç
    const today = new Date();
    const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
    const dow = todayUTC.getUTCDay();
    const sub = dow === 0 ? 6 : dow - 1;
    const monday = new Date(todayUTC);
    monday.setUTCDate(todayUTC.getUTCDate() - sub);
    const mondayStr = monday.toISOString().slice(0,10);

    let foundIdx = mondays.findIndex(m => m.date === mondayStr);
    if (foundIdx === -1) foundIdx = mondays.length - 1;
    selector.value = foundIdx;
    loadWeek(foundIdx);

    document.getElementById('pdf-btn').addEventListener('click', downloadPDF);
});
</script>
